# Root authoring and child operations are separate admitted programs. This
# environment requests only the finite project operations below. Their ordinary
# installed execution has been qualified; worker-to-child acceptance is a
# separate gate. Compiler/dependency trees remain child-owned external content.
category: development/ryeos
schema: ryeos.worker_environment.v5
external_product_slots:
  - id: authoring-tools
    relationship_ref: config:development/ryeos/authoring-environment-products
    relationship: runtime_to_authoring_worker
    kind: tree
    mount_root: execution_runtime
    mount: authoring-tools
worker_ref: worker:codex/hosted-authoring
external_content:
  - id: workload-client
    kind: tree
    mode: pinned
    digest: d40872b7d6da2a9d4768a99297ffbfaa10e2c10fb35f65a0bbc5c9d45490f177
    mount_root: project
    mount: environment/workload-client
configuration:
  executable_search:
    - realization_id: authoring-tools
      relative_directory: bin
    - realization_id: workload-client
      relative_directory: bin
  process_environment:
    GIT_CONFIG_NOSYSTEM: {kind: literal, value: "1"}
    GIT_CONFIG_GLOBAL: {kind: literal, value: /dev/null}
    GIT_PAGER: {kind: literal, value: cat}
    TZ: {kind: literal, value: UTC}
credential_requirement:
  workload_family: codex
  required_state: active
  subject_projection_contract: codex.account.v1
portable_state_contract: ryeos.worker_session.restore.v1
workload_client:
  protocol: ryeos.workload-client/v1
  client:
    realization_id: workload-client
    relative_path: bin/ryeos
  executions:
    - item_ref: tool:ryeos/development/cargo-build
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/cargo-check
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/cargo-test
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/format-check
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
    - item_ref: tool:ryeos/development/format-file
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: shared_exclusive
    - item_ref: tool:ryeos/development/platform-inspect
      ref_bindings: {}
      calls: [{kind: default}]
      effect_classes: [live]
      workspace_access: immutable_current_generation
  max_in_flight: 1
  max_invocations_per_boot: 16
  max_lifetime_seconds: 1800
