# ryeos:signed:2026-09-06T22:36:36Z:49949beb5029bce0443c7669263e50d29e782658a22ca9626a092234fefef0d9:EA5yza8K0pnGMTvGsAgtIcCVhEi8D8xR7R/6xhKxMPcBO8KMGU0ybdg/QXd2iKtm/XHl7sYfUziQvlSSrBIzDA==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
category: ryeos/development
description: Assemble and independently verify the authoring environment in one retained private workspace
requires:
  capabilities:
    declared:
      - ryeos.execute.tool.ryeos/development/authoring-environment-production/assemble
      - ryeos.execute.tool.ryeos/development/authoring-environment-production/verify
config:
  start: assemble
  max_steps: 3
  on_error: fail
  config_schema:
    type: object
    properties: {}
    additionalProperties: false
  nodes:
    assemble:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/authoring-environment-production/assemble
        ref_bindings: {}
        params: {}
        thread: inline
      assign:
        assembly: "${result}"
      next:
        type: unconditional
        to: verify
    verify:
      node_type: action
      effects: live
      cache_result: false
      action:
        item_id: tool:ryeos/development/authoring-environment-production/verify
        ref_bindings: {}
        params: {}
        thread: inline
      assign:
        verification: "${result}"
      next:
        type: unconditional
        to: done
    done:
      node_type: return
      output:
        assembly: "${state.assembly}"
        verification: "${state.verification}"
