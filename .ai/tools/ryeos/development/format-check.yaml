# ryeos:signed:2026-09-06T01:06:23Z:34dfc8bdf6f6666aaa1f145fc4010a9f7daf7b4f87df701e82417404119dd693:Oj0FAiflsAiCP0Dd235AoyMIUWQYgp7k/rKa6qROFDK6Z/JGdaQacQWq0l+sZftbOu46HuTGPiK8dLByl6o+CQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: ryeos/development
name: format-check
version: "1.0.0"
description: Check one explicit RyeOS Rust source file with the admitted formatter
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
workspace_access: immutable_current_generation
filesystem_authority: captured_execution
network_authority: isolated
external_content:
  - id: platform
    kind: tree
    mode: pinned
    digest: 98bceddd5b4024d5963eeac8c579e6d4e79c24577980fa9f88bce9ae3151d316
    mount_root: execution_runtime
    mount: platform
config:
  command: realization:platform/rust/bin/rustfmt
  args: [--check, --edition, "${params.edition}", --config, skip_children=true, "${params.path}"]
  timeout_secs: 60
config_schema:
  type: object
  properties:
    path:
      type: string
      maxLength: 4096
      pattern: '^crates/(?:[A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+\.rs$'
    edition:
      type: string
      enum: ["2021", "2024"]
  required: [path, edition]
  additionalProperties: false
