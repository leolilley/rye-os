# ryeos:signed:2026-09-07T04:35:59Z:dcbbd7cf82b4c109dd9fc588bca9a4b6274338edaa0d837108a7e162d9da9b8e:73HXBZ1ZqPF3P9oX+XNXOak+/cFra0fKJQ5kfx9fk6pMr/WKglKRcE7v+NNBAlngg+0/cySQ2uLLIEbedZ7dCQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
category: ryeos/development
name: cargo-check
version: "1.0.1"
description: Bounded offline Cargo check for the selected RyeOS library packages
executor_id: "@subprocess"
execution_protocol: protocol:ryeos/core/opaque
effects: live
workspace_access: immutable_current_generation
filesystem_authority: captured_execution
network_authority: isolated
external_content:
  - id: platform
    kind: tree
    mode: pinned
    digest: 98bceddd5b4024d5963eeac8c579e6d4e79c24577980fa9f88bce9ae3151d316
    mount_root: execution_runtime
    mount: platform
  - id: vendor
    kind: tree
    mode: pinned
    digest: 8dac785a06faad238b3210c79ba3ca7bee37dc211fe0e95acf80dff6500a75ac
    mount_root: execution_runtime
    mount: cargo-vendor
env_config:
  env:
    PATH: ""
  env_paths:
    PATH:
      prepend:
        - /ryeos/realizations/platform/native/bin
        - /ryeos/realizations/platform/rust/bin
      append: []
config:
  command: realization:platform/rust/bin/cargo
  # Cargo owns dependency resolution. The fixed directory source is the exact
  # retained vendor manifest; no target can acquire a missing dependency.
  args:
    - --config
    - 'source.crates-io.replace-with="ryeos-vendored"'
    - --config
    - 'source.ryeos-vendored.directory="/ryeos/realizations/cargo-vendor"'
    - check
    - --manifest-path
    - Cargo.toml
    - --locked
    - --frozen
    - --offline
    - --jobs
    - "2"
    - --package
    - "${params.package}"
    - --lib
    # This exact platform supplies its native compiler target. Do not pass
    # --target here: Cargo would then exclude host proc-macro/build-script
    # compilations from the admitted linker/sysroot RUSTFLAGS below.
    - --profile
    - dev
  timeout_secs: 300
  env:
    CARGO_HOME: /tmp/cargo
    CARGO_TARGET_DIR: /tmp/target
    RUSTC: /ryeos/realizations/platform/rust/bin/rustc
    RUSTDOC: /ryeos/realizations/platform/rust/bin/rustdoc
    LIBRARY_PATH: /ryeos/realizations/platform/lib
    COMPILER_PATH: /ryeos/realizations/platform/native/bin
    # The flat platform's libc.so is the verified DSO, not the publisher's
    # absolute-path linker script. Preserve its nonshared link input explicitly;
    # the archive already belongs to the exact platform manifest (no host libc).
    RUSTFLAGS: >-
      -C linker=/ryeos/realizations/platform/native/bin/gcc
      -C link-arg=-B/ryeos/realizations/platform/native/bin/
      -C link-arg=-B/ryeos/realizations/platform/lib/
      -C link-arg=--sysroot=/ryeos/realizations/platform/sysroot
      -C link-arg=-fno-use-linker-plugin
      -C link-arg=-fuse-ld=lld
      -C link-arg=-Wl,--dynamic-linker,/ryeos/realizations/platform/lib/ld-linux-x86-64.so.2
      -C link-arg=-Wl,-rpath,/ryeos/realizations/platform/lib:/ryeos/realizations/platform/rust/lib:/ryeos/realizations/platform/rust/lib/rustlib/x86_64-unknown-linux-gnu/lib
      -C link-arg=-Wl,-z,nodefaultlib
      -C link-arg=/ryeos/realizations/platform/lib/libc_nonshared.a
config_schema:
  type: object
  properties:
    package:
      type: string
      enum: [lillux, ryeos-isolation-protocol]
  required: [package]
  additionalProperties: false
