# ryeos:signed:2026-09-05T00:45:20Z:6f1238f3517e1d0d5c0de5fe92e48caec1e47bfbd16a9f44981125af9c92d835:VnSXn4lmzyp6zryQVy1ELx0q5vtK80aw4yQhdS13ZuyEkAKinkgtwnZ6rF2THUUldHjvg6Q2Bng8ZnsSXZYVDQ==:741a8bc609b398aaec0685e5aefb682faf5129a66bd192f888d23bb642c18eea
version: "1.0.0"
executor_id: "@subprocess"
execution_protocol: "protocol:ryeos/core/tool_callback"
category: "ryeos/core"
name: "admission-token"
required_caps: ["ryeos.execute.tool.ryeos.core.admission-token"]
description: "Mint a one-time node-local admission token for remote bootstrap."

config:
  command: "bin:ryeos-core-tools"
  args:
    - "admission-token"
    - "--stdin-json"
  input_data: "${params_json}"
  timeout_secs: 30

config_schema:
  type: object
  properties:
    system_space_dir:
      type: string
      description: "Target node system space root. Defaults to RYEOS_APP_ROOT."
    scopes:
      type: string
      description: "Comma-separated scopes this token may grant."
    label:
      type: string
      description: "Optional default label for the eventual authorized-key entry."
    ttl_secs:
      type: number
      description: "Token lifetime in seconds. Defaults to 600."
      default: 600
  required: [scopes]
